<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Sort Puzzle</title><style>body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;color:#fff;font-family:sans-serif}#game{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:400px;margin:20px 0}.tube{width:65px;height:240px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:0 0 30px 30px;display:flex;flex-direction:column-reverse;align-items:center;padding:5px 5px 12px}.tube.s{transform:translateY(-15px);border-color:#ffeb3b}.ball{width:52px;height:52px;border-radius:50%;margin:2px 0;box-shadow:inset -4px -4px 8px rgba(0,0,0,.3)}button{padding:10px 20px;border:0;border-radius:20px;background:#fff;color:#764ba2;font-weight:700;margin:5px}</style></head><body><h1>Ball Sort Puzzle</h1><div>Moves:<span id="m">0</span></div><div id="game"></div><div><button onclick="u()">Undo</button><button onclick="r()">Restart</button></div><script>const C=['#ff4757','#2ed573','#1e90ff','#ffa502'];let T=[],S=null,M=0,H=[];function I(){T=[];M=0;S=null;H=[];document.getElementById('m').innerText=M;let b=[];for(let i=0;i<3;i++)for(let j=0;j<4;j++)b.push(C[i]);b=b.sort(()=>Math.random()-.5);for(let i=0;i<6;i++){T[i]=[];if(i<3)for(let j=0;j<4;j++)T[i].push(b.pop());}R();}function R(){const g=document.getElementById('game');g.innerHTML='';T.forEach((tube,i)=>{const d=document.createElement('div');d.className='tube'+(S===i?' s':'');d.onclick=()=>K(i);tube.forEach(c=>{const b=document.createElement('div');b.className='ball';b.style.background=c;g.style.backgroundColor=c;d.appendChild(b);b.style.background=`radial-gradient(circle at 30% 30%, #fff, ${c})`;});g.appendChild(d);});W();}function K(i){if(S===null){if(T[i].length>0){S=i;R();}}else{if(S===i){S=null;R();return;}if(Cp(S,i)){H.push(JSON.parse(JSON.stringify(T)));T[i].push(T[S].pop());M++;document.getElementById('m').innerText=M;S=null;R();}else{S=i;R();}}}function Cp(f,t){if(T[f].length===0)return false;if(T[t].length>=4)return false;if(T[t].length===0)return true;return T[t][T[t].length-1]===T[f][T[f].length-1];}function W(){if(T.every(t=>t.length===0||(t.length===4&&t.every(c=>c===t[0])))){setTimeout(()=>{alert('Win in '+M+' moves!');I();},300);}}function u(){if(H.length>0){T=H.pop();M=Math.max(0,M-1);document.getElementById('m').innerText=M;S=null;R();}}function r(){I();}I();</script></body></html>
