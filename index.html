<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ball Sort Puzzle - iOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff}
h1{margin:15px 0 5px;font-size:28px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
#info{background:rgba(255,255,255,.2);padding:8px 20px;border-radius:20px;margin-bottom:15px;backdrop-filter:blur(10px)}
#game{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:420px}
.tube{width:70px;height:260px;background:linear-gradient(to bottom,rgba(255,255,255,.25),rgba(255,255,255,.1));border:2px solid rgba(255,255,255,.4);border-radius:0 0 35px 35px;display:flex;flex-direction:column-reverse;align-items:center;padding:6px 6px 15px;transition:.3s;position:relative}
.tube.sel{transform:translateY(-18px);border-color:#ffeb3b;box-shadow:0 0 20px #ffeb3b}
.ball{width:54px;height:54px;border-radius:50%;margin:2px 0;border:2px solid rgba(0,0,0,.1);box-shadow:inset -5px -5px 10px rgba(0,0,0,.3),0 3px 8px rgba(0,0,0,.2)}
.btns{margin-top:20px;display:flex;gap:10px}
.btn{padding:12px 24px;border:0;border-radius:25px;background:#fff;color:#764ba2;font-weight:800;font-size:16px;box-shadow:0 4px 15px rgba(0,0,0,.2)}
</style>
</head>
<body>
<h1>Ball Sort Puzzle</h1>
<div id="info">Moves: <span id="mv">0</span> | Level: <span id="lv">1</span></div>
<div id="game"></div>
<div class="btns"><button class="btn" onclick="undo()">↩️ Undo</button><button class="btn" onclick="init()">🔄 Restart</button></div>
<script>
const COLORS=['#ff4757','#2ed573','#1e90ff','#ffa502','#ff6b81','#7bed9f'];
let tubes=[],sel=null,moves=0,hist=[];
function init(){tubes=[];moves=0;sel=null;hist=[];document.getElementById('mv').textContent=moves;let balls=[];for(let i=0;i<3;i++)for(let j=0;j<4;j++)balls.push(COLORS[i]);balls=balls.sort(()=>Math.random()-.5);for(let i=0;i<5;i++){tubes[i]=[];if(i<3)for(let j=0;j<4;j++)tubes[i].push(balls.pop());}render();}
function render(){const g=document.getElementById('game');g.innerHTML='';tubes.forEach((tube,i)=>{const d=document.createElement('div');d.className='tube'+(sel===i?' sel':'');d.onclick=()=>clickTube(i);tube.forEach(c=>{const b=document.createElement('div');b.className='ball';b.style.background=`radial-gradient(circle at 35% 35%,#fff,${c} 60%)`;d.appendChild(b);});g.appendChild(d);});checkWin();}
function clickTube(i){if(sel===null){if(tubes[i].length>0){sel=i;render();}}else{if(sel===i){sel=null;render();return;}if(canMove(sel,i)){hist.push(JSON.parse(JSON.stringify(tubes)));tubes[i].push(tubes[sel].pop());moves++;document.getElementById('mv').textContent=moves;sel=null;render();}else{sel=i;render();}}}
function canMove(f,t){if(tubes[f].length===0)return false;if(tubes[t].length>=4)return false;if(tubes[t].length===0)return true;return tubes[t][tubes[t].length-1]===tubes[f][tubes[f].length-1];}
function checkWin(){if(tubes.every(t=>t.length===0||(t.length===4&&t.every(c=>c===t[0])))){setTimeout(()=>{alert('🎉 You Win! Moves: '+moves);init();},400);}}
function undo(){if(hist.length>0){tubes=hist.pop();moves=Math.max(0,moves-1);document.getElementById('mv').textContent=moves;sel=null;render();}}
init();
</script>
</body>
</html>
